<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>taskloop cart</title>
<style>body{font:16px system-ui;margin:3rem auto;max-width:28rem;padding:0 1rem;color:#222}</style>
<p id=s>Opening your Amazon cart…</p>
<p><a id=go href="https://www.amazon.com/gp/aws/cart/add.html">tap here if nothing happens ↗</a></p>
<script>
/* Hosted on GitHub Pages (jeremy-collins.github.io/cart/) — moved off the
   automaton tailscale funnel 2026-08-28 after the 8/27 crash dropped the
   funnel enablement and killed every DM cart link. Pages is always up, so
   the link no longer depends on automaton being awake. Phones hand
   www.amazon.com links straight to the consumer Amazon app; a gestureless
   location.replace() from this domain stays in the browser, where the
   Business sign-in works like on desktop. Cart params travel in the
   #fragment — they never reach any server log. */
var q = location.hash.slice(1);
if (q) {
  /* legacy endpoint on purpose: verified working click in Jeremy's history
     (8/14); the /associates/addtocart target it redirects anon users to is
     confirmed broken when hit directly while signed in */
  var url = 'https://www.amazon.com/gp/aws/cart/add.html?' + q;
  document.getElementById('go').href = url;
  location.replace(url);
} else {
  document.getElementById('s').textContent = 'No cart in this link — open the latest Slack DM link instead.';
}
</script>
